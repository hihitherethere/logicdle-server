<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Logicdle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">

  <header class="site-header">
    <div>
      <p class="site-title"><a href="/index.html">Logicdle</a></p>
      <p class="site-tagline">Admin</p>
    </div>
    <nav class="site-nav" id="user-nav"></nav>
  </header>

  <div id="not-admin" hidden class="notice">
    You need to <a href="/login.html?next=/admin/index.html">sign in with an admin account</a> to see this page.
  </div>

  <div id="admin-ui" hidden>
    <div class="site-nav" style="margin-bottom: 20px;">
      <a href="/admin/index.html" aria-current="page">Puzzles</a>
      <a href="/admin/submissions.html">Submissions</a>
    </div>

    <div class="admin-card" style="margin-bottom: 32px;">
      <h2 id="form-title">New puzzle</h2>
      <form class="auth-form" id="puzzle-form">
        <p class="form-note" id="editing-id-note" hidden></p>

        <div class="field">
            <label>Release date</label>
            <div style="display:flex; gap:16px; font-family: var(--font-body); font-size: 0.9rem; margin-bottom: 4px;">
              <label style="display:flex; align-items:center; gap:6px; text-transform:none; letter-spacing:normal; font-size:0.9rem;">
                <input type="radio" name="date-mode" id="date-mode-auto" value="auto" checked>
                Automatic (after the latest queued puzzle)
              </label>
              <label style="display:flex; align-items:center; gap:6px; text-transform:none; letter-spacing:normal; font-size:0.9rem;">
                <input type="radio" name="date-mode" id="date-mode-manual" value="manual">
                Manual
              </label>
            </div>
            <input id="f-date" pattern="\d{4}-\d{2}-\d{2}" placeholder="2026-09-01" disabled>
          </div>
          <div class="field">
            <label for="f-title">Title</label>
            <input id="f-title" required placeholder="Nurikabe">
          </div>
          <div class="field">
            <label for="f-type">Puzzle type</label>
            <input id="f-type" required placeholder="Classic, Twist, Word, Custom">
          </div>
          <div class="field">
            <label>Difficulty</label>
            <div class="star-picker" data-star-picker>
              <button type="button" class="star" data-star="1">★</button>
              <button type="button" class="star" data-star="2">★</button>
              <button type="button" class="star" data-star="3">★</button>
              <button type="button" class="star" data-star="4">★</button>
              <button type="button" class="star" data-star="5">★</button>
            </div>
            <input type="hidden" id="f-difficulty" required>
          </div>
          <div class="field">
            <label for="f-author">Author (credited on the puzzle)</label>
            <input id="f-author" required>
          </div>
          <div class="field">
            <label for="f-share">Penpa link (optional if you provide an answer below instead)</label>
            <textarea id="f-share" rows="3" placeholder="Paste the full URL from penpa's URL with answer check link, e.g. https://swaroopg92.github.io/penpa-edit/#m=..."></textarea>
          </div>
          <div class="field">
            <label for="f-answer">Correct answer (optional) — for word/competition-style puzzles checked by typed answer instead of a grid</label>
            <input id="f-answer" placeholder="e.g. RIVERBANK">
          </div>
          <div class="field">
            <label for="f-success">Success message (only used if you provided a Penpa link, DON'T CHANGE)</label>
            <input id="f-success" value="Congratulations">
          </div>
          <div class="field">
            <label for="f-extras">Extra content (shown ABOVE the puzzle) — links work: [label](https://...) or paste a bare URL</label>
            <textarea id="f-extras" rows="3" placeholder="Optional note or context for this puzzle"></textarea>
          </div>
          <div class="field">
            <label for="f-extras-image">Extra content images</label>
            <input id="f-extras-image" type="file" accept="image/*">
            <div class="thumb-row" id="extras-thumb-row"></div>
          </div>
          <div class="field">
            <label for="f-rules">Rules text — links work: [label](https://...) or paste a bare URL</label>
            <textarea id="f-rules" rows="6" placeholder="Shade some cells so that..."></textarea>
          </div>
          <div class="field">
            <label for="f-image">Rule images</label>
            <input id="f-image" type="file" accept="image/*">
            <div class="thumb-row" id="thumb-row"></div>
          </div>
          <p class="form-error" id="form-error"></p>
          <div style="display:flex; gap:10px;">
            <button class="btn btn-primary" type="submit" id="save-btn">Save puzzle</button>
            <button class="btn" type="button" id="clear-form-btn">New / clear form</button>
          </div>
        </form>
      </div>

    <div class="admin-card">
      <h2>Manage puzzles</h2>
      <div class="archive-controls" style="margin-bottom: 12px;">
        <input type="search" id="puzzle-search" placeholder="Search title or type…">
      </div>
      <p class="archive-count" id="puzzle-count"></p>
      <div class="puzzle-list" id="puzzle-list"></div>
      <div class="archive-pagination" id="puzzle-pagination" hidden>
        <button class="btn" id="puzzle-prev-btn">← Prev</button>
        <span class="page-info" id="puzzle-page-info"></span>
        <button class="btn" id="puzzle-next-btn">Next →</button>
      </div>
    </div>
  </div>

</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/star-picker.js"></script>
<script src="/admin/js/admin.js"></script>
</body>
</html>
