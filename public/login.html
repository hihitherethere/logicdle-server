<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Logicdle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap narrow">
  <header class="site-header">
    <div>
      <p class="site-title"><a href="/index.html">Logicdle</a></p>
    </div>
  </header>

  <div class="pad">
    <div class="pad-page">
      <h2>Sign in</h2>
      <form class="auth-form" id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p class="form-error" id="form-error"></p>
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>
      <p class="form-note" style="margin-top:16px;">No account yet? <a href="/register.html">Register</a></p>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var next = params.get("next") || "/index.html";
  var form = document.getElementById("login-form");
  var errorEl = document.getElementById("form-error");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    errorEl.textContent = "";
    Api.post("/api/auth/login", {
      username: document.getElementById("username").value.trim(),
      password: document.getElementById("password").value,
    })
      .then(function () { location.href = next; })
      .catch(function (err) { errorEl.textContent = err.message; });
  });
})();
</script>
</body>
</html>
