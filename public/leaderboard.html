<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard — Logicdle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">

  <header class="site-header">
    <div>
      <p class="site-title"><a href="/index.html">Logicdle</a></p>
      <p class="site-tagline"><a href="/leaderboards.html">← All leaderboards</a></p>
    </div>
    <nav class="site-nav" id="user-nav"></nav>
  </header>

  <div id="notice" hidden class="notice"></div>

  <div id="lb-ui" hidden>
    <div class="pad-head">
      <div>
        <h1 id="lb-name" style="font-family: var(--font-display); font-size: clamp(1.5rem, 3.4vw, 2.1rem); margin: 0 0 6px;"></h1>
        <div class="pad-meta">
          <span id="lb-members">—</span>
          <span id="lb-code">—</span>
        </div>
      </div>
      <button class="btn" id="leave-btn">Leave</button>
    </div>

    <p class="archive-intro" style="margin-top: 16px;">
      Each day's results appear here once that day has passed — while a puzzle is
      still "today's," nobody's standing is shown, so solving it isn't a race.
    </p>

    <div id="days-list"></div>

    <div class="archive-pagination" id="pagination" hidden>
      <button class="btn" id="prev-btn">← Prev</button>
      <span class="page-info" id="page-info"></span>
      <button class="btn" id="next-btn">Next →</button>
    </div>
  </div>

</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("id");
  var noticeEl = document.getElementById("notice");
  var uiEl = document.getElementById("lb-ui");
  var listEl = document.getElementById("days-list");
  var pagination = document.getElementById("pagination");
  var prevBtn = document.getElementById("prev-btn");
  var nextBtn = document.getElementById("next-btn");
  var pageInfo = document.getElementById("page-info");

  var DAYS_PER_PAGE = 5;
  var page = 1;
  var allDays = [];
  var currentUsername = null;

  if (!id) {
    noticeEl.hidden = false;
    noticeEl.innerHTML = 'No leaderboard specified. Go back to <a href="/leaderboards.html">all leaderboards</a>.';
  } else {
    Api.get("/api/auth/me").then(function (res) {
      if (!res.user) {
        location.href = "/login.html?next=" + encodeURIComponent(location.pathname + location.search);
        return;
      }
      currentUsername = res.user.username;
      load();
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function formatMs(ms) {
    var totalSec = Math.round(ms / 1000);
    return Math.floor(totalSec / 60) + ":" + String(totalSec % 60).padStart(2, "0");
  }

  // Medal/rank styling: gold/silver/bronze for the top 3, a lighter
  // highlight through rank 10, and your own row always stands out
  // regardless of where you land.
  function rowClass(rank, username) {
    var classes = [];
    if (rank === 1) classes.push("lb-rank-1");
    else if (rank === 2) classes.push("lb-rank-2");
    else if (rank === 3) classes.push("lb-rank-3");
    else if (rank <= 10) classes.push("lb-rank-top10");
    if (currentUsername && username.toLowerCase() === currentUsername.toLowerCase()) {
      classes.push("lb-you");
    }
    return classes.join(" ");
  }

  function rankLabel(rank) {
    if (rank === 1) return "🥇 1";
    if (rank === 2) return "🥈 2";
    if (rank === 3) return "🥉 3";
    return String(rank);
  }

  function renderDays() {
    var totalPages = Math.max(1, Math.ceil(allDays.length / DAYS_PER_PAGE));
    if (page > totalPages) page = totalPages;
    if (page < 1) page = 1;
    var pageDays = allDays.slice((page - 1) * DAYS_PER_PAGE, page * DAYS_PER_PAGE);

    listEl.innerHTML = "";
    if (!allDays.length) {
      listEl.innerHTML = '<p class="form-note">No completed days yet — results for a puzzle show up here the day after it releases, once at least one member has solved it.</p>';
    }
    pageDays.forEach(function (day) {
      var card = document.createElement("div");
      card.className = "submission-card";
      var rows = day.results.map(function (r) {
        return (
          '<tr class="' + rowClass(r.rank, r.username) + '">' +
          "<td>" + rankLabel(r.rank) + "</td>" +
          "<td>" + escapeHtml(r.username) + (currentUsername && r.username.toLowerCase() === currentUsername.toLowerCase() ? " (you)" : "") + "</td>" +
          "<td>" + formatMs(r.timeMs) + "</td>" +
          "</tr>"
        );
      }).join("");
      card.innerHTML =
        '<div class="submission-head"><div class="t">' + escapeHtml(day.title) + '</div>' +
        '<div class="submission-meta">' + day.date + "</div></div>" +
        '<table class="completions-table lb-table" style="margin-top:10px;"><thead><tr><th>Rank</th><th>Player</th><th>Time</th></tr></thead><tbody>' +
        rows + "</tbody></table>";
      listEl.appendChild(card);
    });

    if (totalPages > 1) {
      pagination.hidden = false;
      pageInfo.textContent = "Page " + page + " of " + totalPages;
      prevBtn.disabled = page <= 1;
      nextBtn.disabled = page >= totalPages;
    } else {
      pagination.hidden = true;
    }
  }

  prevBtn.addEventListener("click", function () { page--; renderDays(); window.scrollTo({ top: 0, behavior: "smooth" }); });
  nextBtn.addEventListener("click", function () { page++; renderDays(); window.scrollTo({ top: 0, behavior: "smooth" }); });

  function load() {
    Api.get("/api/leaderboards/" + encodeURIComponent(id))
      .then(function (res) {
        uiEl.hidden = false;
        document.title = res.leaderboard.name + " — Logicdle";
        document.getElementById("lb-name").textContent = res.leaderboard.name;
        document.getElementById("lb-members").textContent =
          res.leaderboard.memberCount + (res.leaderboard.memberCount === 1 ? " member" : " members");
        document.getElementById("lb-code").textContent = "Join code: " + res.leaderboard.joinCode;

        allDays = res.days;
        page = 1;
        renderDays();

        document.getElementById("leave-btn").addEventListener("click", function () {
          if (!confirm('Leave "' + res.leaderboard.name + '"?')) return;
          Api.post("/api/leaderboards/" + encodeURIComponent(id) + "/leave").then(function () {
            location.href = "/leaderboards.html";
          });
        });
      })
      .catch(function (err) {
        noticeEl.hidden = false;
        noticeEl.textContent = err.message;
      });
  }
})();
</script>
</body>
</html>
