<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logicdle — Daily Puzzle</title>
<meta name="description" content="A new puzzle every day, solved right in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">

  <header class="site-header">
    <div>
      <p class="site-title"><a href="/index.html">Logicdle</a></p>
      <p class="site-tagline">A puzzle a day</p>
    </div>
    <nav class="site-nav" id="user-nav"></nav>
  </header>

  <div class="home-hero">
    <h1>A new puzzle, every day.</h1>
    <div class="home-actions">
      <a class="btn btn-primary btn-big" id="play-today-btn" href="#">Play today's puzzle</a>
      <a class="btn btn-big" href="/archive.html">Browse the archive</a>
    </div>
    <p class="today-preview" id="today-preview"></p>
  </div>

  <footer class="site-footer">
    <span>Built by hihitherethere and Claude Code.</span>
  </footer>

</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
(function () {
  var preview = document.getElementById("today-preview");
  var playBtn = document.getElementById("play-today-btn");

  Api.get("/api/puzzles/today")
    .then(function (res) {
      var p = res.puzzle;
      playBtn.href = "/rules.html?puzzle=" + encodeURIComponent(p.id);
      preview.textContent = res.isExactlyToday
        ? "Today: " + p.title + " (" + p.type + ", " + p.difficulty + ")"
        : "Today's puzzle isn't posted yet — playing the most recent release: " + p.title;
    })
    .catch(function () {
      playBtn.removeAttribute("href");
      playBtn.setAttribute("aria-disabled", "true");
      preview.textContent = "No puzzles have been released yet — check back soon.";
    });
})();
</script>
</body>
</html>
